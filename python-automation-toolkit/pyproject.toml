[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-automation-toolkit"
version = "0.1.0"
description = "Practical Python automation and CLI tooling for portfolio proof work."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Bulent Ruhat Karatas" }
]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

