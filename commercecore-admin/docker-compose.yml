services:
  postgres:
    image: postgres:16-alpine
    container_name: commercecore-postgres
    environment:
      POSTGRES_DB: commercecore_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - commercecore_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d commercecore_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: commercecore-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_PORT: 8090
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: commercecore_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CORS_ALLOWED_ORIGINS: http://localhost:5175,http://127.0.0.1:5175
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8090:8090"

volumes:
  commercecore_postgres_data:
